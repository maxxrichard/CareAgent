[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careagent"
version = "0.1.0"
description = "Agentic customer self-service assistant: typed tools, grounded RAG answers, citation checking and human hand-off."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maxx Richard Rahman" }]
keywords = ["agents", "pydantic-ai", "rag", "customer-support", "llm", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pydantic-ai-slim[anthropic,openai]>=1.0",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
datasets = ["datasets>=2.19"]
tracking = ["mlflow>=2.14"]
databricks = ["mlflow>=2.14", "databricks-sdk>=0.30", "pyspark>=3.5", "delta-spark>=3.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
all = ["careagent[embeddings,datasets,tracking,dev]"]

[project.scripts]
careagent = "careagent.cli:app"

[project.urls]
Homepage = "https://github.com/maxxrichard/CareAgent"
Repository = "https://github.com/maxxrichard/CareAgent"

[tool.hatch.build.targets.wheel]
packages = ["careagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "UP042"]  # typer defaults; str-Enum needed for JSON/SQLite

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
