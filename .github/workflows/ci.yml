name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test (offline, scripted models)
        env:
          PYDANTIC_AI_NO_BANNER: "1"
        run: pytest -q --cov=careagent --cov-report=term-missing
      - name: Offline evaluation smoke run
        env:
          PYDANTIC_AI_NO_BANNER: "1"
        run: python -c "from careagent.evaluation.dataset import load_cases; assert len(load_cases()) == 500"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: careagent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
